<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0E18" />
      <stop offset="50%" stop-color="#08080E" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <!-- Top Face Gradient (Cyan -> Electric Blue) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.45" />
    </linearGradient>

    <!-- Left Face Gradient (Magenta -> Neon Purple) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.4" />
    </linearGradient>

    <!-- Right Face Gradient (Gold -> Amber / Orange) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Vector Container Backdrop -->
  <!-- Ambient Light Halos -->
  <circle cx="256" cy="180" r="140" fill="#38BDF8" opacity="0.12" filter="url(#intenseGlow)" />
  <circle cx="170" cy="310" r="130" fill="#EC4899" opacity="0.12" filter="url(#intenseGlow)" />
  <circle cx="340" cy="310" r="130" fill="#FBBF24" opacity="0.12" filter="url(#intenseGlow)" />

  <!-- ================= ISOMETRIC 3D CUBE ================= -->
  <!-- Top Face (X-Z plane): (256, 90) -> (390, 165) -> (256, 240) -> (122, 165) -->
  <polygon points="256,90 390,165 256,240 122,165" fill="url(#topFace)" stroke="#67E8F9" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Left Face (Y-Z plane): (122, 165) -> (256, 240) -> (256, 395) -> (122, 320) -->
  <polygon points="122,165 256,240 256,395 122,320" fill="url(#leftFace)" stroke="#F472B6" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Right Face (X-Y plane): (256, 240) -> (390, 165) -> (390, 320) -> (256, 395) -->
  <polygon points="256,240 390,165 390,320 256,395" fill="url(#rightFace)" stroke="#FCD34D" stroke-width="3.5" stroke-linejoin="round" />

  <!-- ================= PIXEL MATRIX & COMPUTATION GRIDS ================= -->
  <!-- Top Grid Lines (Perspective & Raster Matrix) -->
  <line x1="189" y1="127.5" x2="323" y2="202.5" stroke="#E0F2FE" stroke-width="1.5" opacity="0.4" />
  <line x1="155.5" y1="202.5" x2="289.5" y2="127.5" stroke="#E0F2FE" stroke-width="1.5" opacity="0.4" />

  <!-- Top Pixel Blocks -->
  <polygon points="256,140 280,153.5 256,167 232,153.5" fill="#38BDF8" opacity="0.8" />
  <polygon points="280,153.5 304,167 280,180.5 256,167" fill="#67E8F9" opacity="0.9" />
  <polygon points="232,153.5 256,167 232,180.5 208,167" fill="#0284C7" opacity="0.9" />
  <polygon points="256,167 280,180.5 256,194 232,180.5" fill="#E0F2FE" opacity="0.95" />

  <!-- Left Pixel Grid -->
  <polygon points="155.5,225 189,244 189,282 155.5,263" fill="#F472B6" opacity="0.75" />
  <polygon points="189,244 222.5,263 222.5,301 189,282" fill="#EC4899" opacity="0.85" />
  <polygon points="155.5,263 189,282 189,320 155.5,301" fill="#DB2777" opacity="0.8" />
  <polygon points="189,282 222.5,301 222.5,339 189,320" fill="#BE185D" opacity="0.9" />

  <!-- Right Shader Grid -->
  <polygon points="289.5,263 323,244 323,282 289.5,301" fill="#FBBF24" opacity="0.75" />
  <polygon points="323,244 356.5,225 356.5,263 323,282" fill="#F59E0B" opacity="0.85" />
  <polygon points="289.5,301 323,282 323,320 289.5,339" fill="#D97706" opacity="0.8" />
  <polygon points="323,282 356.5,263 356.5,301 323,320" fill="#B45309" opacity="0.9" />

  <!-- ================= RAY TRACING BEAMS & COORDINATE AXES ================= -->
  <!-- Rays Shooting Out from Vertices -->
  <line x1="256" y1="90" x2="256" y2="40" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="122" y1="165" x2="70" y2="135" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="390" y1="165" x2="442" y2="135" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="122" y1="320" x2="65" y2="352" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="390" y1="320" x2="447" y2="352" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="256" y1="395" x2="256" y2="455" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Internal Ray Tracing Axes passing through Center (256, 240) -->
  <line x1="256" y1="90" x2="256" y2="395" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
  <line x1="122" y1="165" x2="390" y2="320" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
  <line x1="390" y1="165" x2="122" y2="320" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Glowing Nodes at Vertices -->
  <circle cx="256" cy="90" r="10" fill="#E0F2FE" stroke="#38BDF8" stroke-width="3.5" filter="url(#neonGlow)" />
  <circle cx="390" cy="165" r="9" fill="#FEF3C7" stroke="#FBBF24" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="122" cy="165" r="9" fill="#E0F2FE" stroke="#38BDF8" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="256" cy="240" r="12" fill="#FFFFFF" stroke="#60A5FA" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="122" cy="320" r="9" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="390" cy="320" r="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="256" cy="395" r="10" fill="#FFE4E6" stroke="#F43F5E" stroke-width="3.5" filter="url(#neonGlow)" />
</svg>
