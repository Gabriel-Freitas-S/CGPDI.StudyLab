<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Cube Wireframe / Polygon -->
  <polygon points="50,10 88,30 88,70 50,90 12,70 12,30" fill="url(#grad2)" opacity="0.15" stroke="url(#grad1)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- 3D Coordinate Axis / Internal Cube -->
  <line x1="50" y1="50" x2="50" y2="10" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="50" x2="88" y2="70" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="50" x2="12" y2="70" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Focal Point / Ray Origin -->
  <circle cx="50" cy="50" r="6" fill="#38bdf8" />
  <circle cx="50" cy="10" r="4" fill="#818cf8" />
  <circle cx="88" cy="70" r="4" fill="#c084fc" />
  <circle cx="12" cy="70" r="4" fill="#38bdf8" />
  
  <!-- Light Ray / Vector -->
  <line x1="50" y1="50" x2="72" y2="28" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,2" />
  <circle cx="72" cy="28" r="3" fill="#f59e0b" />
</svg>
