<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F1A" />
      <stop offset="100%" stop-color="#06060C" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Top Face Gradient -->
    <linearGradient id="topFaceFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="leftFaceFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.45" />
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="rightFaceFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.45" />
    </linearGradient>

    <filter id="glowFull" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="800" height="200" rx="20" fill="url(#bgGradFull)" stroke="#222238" stroke-width="1.5" />

  <!-- ================= LOGO ICON (LEFT) ================= -->
  <g transform="translate(25, 10) scale(0.35)">
    <!-- Ambient Light Halos -->
    <circle cx="256" cy="180" r="140" fill="#38BDF8" opacity="0.2" filter="url(#glowFull)" />
    <circle cx="170" cy="310" r="130" fill="#EC4899" opacity="0.2" filter="url(#glowFull)" />
    <circle cx="340" cy="310" r="130" fill="#FBBF24" opacity="0.2" filter="url(#glowFull)" />

    <!-- Isometric 3D Cube -->
    <polygon points="256,90 390,165 256,240 122,165" fill="url(#topFaceFull)" stroke="#67E8F9" stroke-width="4" stroke-linejoin="round" />
    <polygon points="122,165 256,240 256,395 122,320" fill="url(#leftFaceFull)" stroke="#F472B6" stroke-width="4" stroke-linejoin="round" />
    <polygon points="256,240 390,165 390,320 256,395" fill="url(#rightFaceFull)" stroke="#FCD34D" stroke-width="4" stroke-linejoin="round" />

    <!-- Top Pixel Blocks -->
    <polygon points="256,140 280,153.5 256,167 232,153.5" fill="#38BDF8" opacity="0.85" />
    <polygon points="280,153.5 304,167 280,180.5 256,167" fill="#67E8F9" opacity="0.95" />
    <polygon points="232,153.5 256,167 232,180.5 208,167" fill="#0284C7" opacity="0.95" />
    <polygon points="256,167 280,180.5 256,194 232,180.5" fill="#E0F2FE" opacity="1" />

    <!-- Rays Shooting Out -->
    <line x1="256" y1="90" x2="256" y2="35" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" filter="url(#glowFull)" />
    <line x1="122" y1="165" x2="60" y2="130" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" filter="url(#glowFull)" />
    <line x1="390" y1="165" x2="450" y2="130" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round" filter="url(#glowFull)" />
    <line x1="122" y1="320" x2="55" y2="357" stroke="#EC4899" stroke-width="3.5" stroke-linecap="round" filter="url(#glowFull)" />
    <line x1="390" y1="320" x2="455" y2="357" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round" filter="url(#glowFull)" />
    <line x1="256" y1="395" x2="256" y2="465" stroke="#F43F5E" stroke-width="4" stroke-linecap="round" filter="url(#glowFull)" />

    <!-- Nodes -->
    <circle cx="256" cy="90" r="8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="3.5" filter="url(#glowFull)" />
    <circle cx="390" cy="165" r="7" fill="#FEF3C7" stroke="#FBBF24" stroke-width="3.5" filter="url(#glowFull)" />
    <circle cx="122" cy="165" r="7" fill="#E0F2FE" stroke="#38BDF8" stroke-width="3.5" filter="url(#glowFull)" />
    <circle cx="256" cy="240" r="9" fill="#FFFFFF" stroke="#60A5FA" stroke-width="3.5" filter="url(#glowFull)" />
    <circle cx="122" cy="320" r="7" fill="#FCE7F3" stroke="#EC4899" stroke-width="3.5" filter="url(#glowFull)" />
    <circle cx="390" cy="320" r="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3.5" filter="url(#glowFull)" />
    <circle cx="256" cy="395" r="8" fill="#FFE4E6" stroke="#F43F5E" stroke-width="3.5" filter="url(#glowFull)" />
  </g>

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(230, 0)">
    <!-- Brand Title -->
    <text x="0" y="85" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="url(#textGrad)">
      CGPDI<tspan fill="#F8FAFC" font-weight="300"> STUDYLAB</tspan>
    </text>

    <!-- Subtitle Badge -->
    <rect x="0" y="105" width="220" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="110" y="121" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#38BDF8" text-anchor="middle">
      PLATAFORMA INTERATIVA
    </text>

    <!-- Educational Mission Statement -->
    <text x="0" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#94A3B8">
      Computação Gráfica 2D/3D &amp; Processamento Digital de Imagens em C# / WPF
    </text>
  </g>
</svg>
