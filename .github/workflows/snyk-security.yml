name: Snyk Security Analysis & Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Snyk Security Scan (.NET & Docs)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Snyk CLI
        run: npm install -g snyk


      - name: Restore .NET dependencies
        run: dotnet restore CGPDI.StudyLab/CGPDI.StudyLab.csproj

      - name: Install Docs dependencies
        working-directory: ./docs
        run: npm ci || npm install

      # Snyk Open Source (.NET) — gera SARIF
      - name: Snyk Open Source (.NET Dependencies)
        run: snyk test --file=CGPDI.StudyLab/CGPDI.StudyLab.csproj --severity-threshold=medium --sarif-file-output=snyk-dotnet.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # Snyk Code (SAST) — gera SARIF (não suporta --severity-threshold)
      - name: Snyk Code (C# SAST)
        run: snyk code test --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # Snyk Open Source (Docs / npm) — gera SARIF
      - name: Snyk Open Source (Docs Dependencies)
        working-directory: ./docs
        run: snyk test --severity-threshold=medium --sarif-file-output=../snyk-docs.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # Garante que os arquivos SARIF existam (mesmo vazios) para o upload não falhar
      - name: Ensure SARIF files exist
        run: |
          for f in snyk-dotnet.sarif snyk-code.sarif snyk-docs.sarif; do
            if [ ! -f "$f" ]; then
              echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Snyk","rules":[]}},"results":[]}]}' > "$f"
            fi
          done

      # Upload dos relatórios SARIF para o GitHub Security tab
      - name: Upload .NET SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-dotnet.sarif
          category: snyk-dotnet

      - name: Upload Snyk Code SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Docs SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-docs.sarif
          category: snyk-docs

      # Hard Gate: Falha a pipeline se houver vulnerabilidade moderada ou superior
      - name: Snyk Security Gate (.NET Dependencies)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=CGPDI.StudyLab/CGPDI.StudyLab.csproj --severity-threshold=medium

      - name: Snyk Security Gate (Docs Dependencies)
        working-directory: ./docs
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=medium
