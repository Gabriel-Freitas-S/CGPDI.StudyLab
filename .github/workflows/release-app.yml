name: Build & Release Executable and Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Portable ZIP & Installer Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
            $tag = "v$ver"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } else {
            [xml]$xml = Get-Content "CGPDI.StudyLab/CGPDI.StudyLab.csproj"
            $ver = $xml.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.0.0" }
            $tag = "v$ver"
          }
          Write-Host "Tag: $tag, Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Application & Verify
        run: dotnet build CGPDI.StudyLab/CGPDI.StudyLab.csproj -c Release /p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: Publish Self-Contained App (win-x64)
        shell: pwsh
        run: |
          dotnet publish CGPDI.StudyLab/CGPDI.StudyLab.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish/win-x64 `
            /p:Version=${{ steps.get_version.outputs.VERSION }} `
            /p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}.0 `
            /p:FileVersion=${{ steps.get_version.outputs.VERSION }}.0

      - name: Create Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "CGPDI-StudyLab-Portable-win-x64.zip" -CompressionLevel Optimal
          Write-Host "Portable ZIP created successfully: CGPDI-StudyLab-Portable-win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Windows Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.get_version.outputs.VERSION }} installer/setup_script.iss
          if (Test-Path "dist-installer/CGPDI-StudyLab-Setup.exe") {
            Move-Item -Path "dist-installer/CGPDI-StudyLab-Setup.exe" -Destination "CGPDI-StudyLab-Setup.exe" -Force
            Write-Host "Installer created successfully: CGPDI-StudyLab-Setup.exe"
          } else {
            throw "Installer binary was not generated."
          }

      - name: Upload Binaries to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CGPDI-StudyLab-v${{ steps.get_version.outputs.VERSION }}-Binaries
          path: |
            CGPDI-StudyLab-Setup.exe
            CGPDI-StudyLab-Portable-win-x64.zip
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "CGPDI StudyLab ${{ steps.get_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            CGPDI-StudyLab-Setup.exe
            CGPDI-StudyLab-Portable-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
