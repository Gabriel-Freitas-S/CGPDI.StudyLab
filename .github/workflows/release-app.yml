name: Build & Release Executable and Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Velopack Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
            $tag = "v$ver"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } else {
            # Lê major e minor do csproj (ex: 1.0) e combina com o número da execução para auto-incrementar a cada commit
            [xml]$xml = Get-Content "CGPDI.StudyLab/CGPDI.StudyLab.csproj"
            $baseVer = $xml.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($baseVer)) { $baseVer = "1.0.0" }
            
            $parts = $baseVer.Split('.')
            $major = if ($parts.Length -gt 0) { $parts[0] } else { "1" }
            $minor = if ($parts.Length -gt 1) { $parts[1] } else { "0" }
            $runNum = "${{ github.run_number }}"
            
            $ver = "$major.$minor.$runNum"
            $tag = "v$ver"
          }
          Write-Host "Auto-Incremented Release Tag: $tag, Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tag" >> $env:GITHUB_OUTPUT

      - name: Extract Changelog for Release Notes
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $changelogPath = "CHANGELOG.md"
          if (!(Test-Path $changelogPath)) {
            throw "CHANGELOG.md não encontrado. Toda release precisa de uma seção no changelog."
          }
          $pattern = "^##\s*\[\s*v?$([regex]::Escape($ver))\s*\]"
          $lines = Get-Content $changelogPath
          $inSection = $false
          $notes = @()
          foreach ($line in $lines) {
            if ($line -match "^##\s*\[") {
              if ($inSection) { break }
              if ($line -match $pattern) { $inSection = $true }
              continue
            }
            if ($inSection) { $notes += $line }
          }

          # Fallback 1: Se não encontrou a seção da versão exata, tenta '## [Unreleased]'
          if ($notes.Count -eq 0 -or ($notes -join "").Trim().Length -eq 0) {
            $inUnreleased = $false
            $unreleasedNotes = @()
            foreach ($line in $lines) {
              if ($line -match "^##\s*\[") {
                if ($inUnreleased) { break }
                if ($line -match "^##\s*\[\s*Unreleased\s*\]") { $inUnreleased = $true }
                continue
              }
              if ($inUnreleased) { $unreleasedNotes += $line }
            }
            if (($unreleasedNotes -join "").Trim().Length -gt 0) {
              $notes = $unreleasedNotes
              Write-Host "Usando notas da seção [Unreleased] para a release $ver."
            }
          }

          # Fallback 2: Se [Unreleased] estiver vazio, extrai a primeira versão documentada mais recente
          if ($notes.Count -eq 0 -or ($notes -join "").Trim().Length -eq 0) {
            $inFirstVer = $false
            $firstVerNotes = @()
            foreach ($line in $lines) {
              if ($line -match "^##\s*\[") {
                if ($inFirstVer) { break }
                if ($line -match "^##\s*\[\s*v?\d+\.\d+") { $inFirstVer = $true }
                continue
              }
              if ($inFirstVer) { $firstVerNotes += $line }
            }
            if (($firstVerNotes -join "").Trim().Length -gt 0) {
              $notes = $firstVerNotes
              Write-Host "Usando notas da seção de versão mais recente para a release $ver."
            }
          }

          if ($notes.Count -eq 0 -or ($notes -join "").Trim().Length -eq 0) {
            throw "Nenhuma seção com notas de release encontrada em CHANGELOG.md."
          }
          $notes | Set-Content -Path "release-notes.md" -Encoding utf8
          Write-Host "Notas de release extraídas do CHANGELOG.md ($($notes.Count) linhas)."

      - name: Build Application & Verify
        run: |
          dotnet build CGPDI.StudyLab/CGPDI.StudyLab.csproj -c Release `
            /p:Version=${{ steps.get_version.outputs.VERSION }} `
            /p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}.0 `
            /p:FileVersion=${{ steps.get_version.outputs.VERSION }}.0

      - name: Run Unit & UI Tests (gate)
        shell: pwsh
        run: |
          dotnet test CGPDI.StudyLab.Tests/CGPDI.StudyLab.Tests.csproj -c Release `
            --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Testes falharam. A release não pode ser publicada com regressões."
          }

      - name: Install & Configure Snyk CLI
        shell: pwsh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk config set api="$env:SNYK_TOKEN"

      - name: Snyk Security Gate (Block Release on Medium+ Vulnerabilities)
        shell: pwsh
        run: |
          Write-Host "Executando Snyk Security Gate (limiar: moderado / medium ou superior)..."
          snyk test --file="CGPDI.StudyLab/CGPDI.StudyLab.csproj" --severity-threshold=medium
          if ($LASTEXITCODE -ne 0) {
            throw "Vulnerabilidades moderadas ou superiores encontradas nas dependencias pelo Snyk. Release cancelada."
          }
          snyk code test
          if ($LASTEXITCODE -ne 0) {
            throw "Vulnerabilidades encontradas no codigo-fonte pelo Snyk. Release cancelada."
          }

      - name: Publish Single-File Self-Contained App (win-x64)
        shell: pwsh
        run: |
          dotnet publish CGPDI.StudyLab/CGPDI.StudyLab.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64 `
            /p:Version=${{ steps.get_version.outputs.VERSION }} `
            /p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}.0 `
            /p:FileVersion=${{ steps.get_version.outputs.VERSION }}.0
          
          # Remove arquivos de debug (.pdb) da pasta de distribuição
          Get-ChildItem -Path "publish/win-x64" -Filter "*.pdb" | Remove-Item -Force

      - name: Create Portable ZIP (manual download)
        shell: pwsh
        run: |
          "CGPDI StudyLab v${{ steps.get_version.outputs.VERSION }} - Executavel Unico Portatil`r`n`r`nBasta dar dois cliques em CGPDI.StudyLab.exe para iniciar!`r`nNao requer instalacao nem direitos de administrador." | Out-File -FilePath "publish/win-x64/COMO-USAR.txt" -Encoding utf8
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "CGPDI-StudyLab-Portable-win-x64.zip" -CompressionLevel Optimal
          Write-Host "Portable ZIP created successfully."

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk

      - name: Download Previous Release (delta base)
        shell: pwsh
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Nenhuma release Velopack anterior encontrada — pacote completo (sem delta) para a primeira versão."
          }

      - name: Pack with Velopack (installer + deltas + release notes)
        shell: pwsh
        run: |
          vpk pack `
            -u CGPDIStudyLab `
            -v ${{ steps.get_version.outputs.VERSION }} `
            -p publish/win-x64 `
            -e CGPDI.StudyLab.exe `
            --packTitle "CGPDI StudyLab" `
            --icon "CGPDI.StudyLab/Assets/app_icon.ico" `
            --shortcuts Desktop,StartMenu `
            --instLocation Either `
            --releaseNotes release-notes.md

      - name: Pack Machine-Wide MSI (IT / labs deployment)
        shell: pwsh
        run: |
          vpk pack `
            -u CGPDIStudyLab `
            -v ${{ steps.get_version.outputs.VERSION }} `
            -p publish/win-x64 `
            -e CGPDI.StudyLab.exe `
            --packTitle "CGPDI StudyLab" `
            --icon "CGPDI.StudyLab/Assets/app_icon.ico" `
            --msi true `
            --releaseNotes release-notes.md `
            -o Releases-msi
          Copy-Item "Releases-msi/CGPDIStudyLab-win.msi" "CGPDI-StudyLab-MachineWide.msi" -Force
          Write-Host "Machine-wide MSI created: CGPDI-StudyLab-MachineWide.msi"

      - name: Upload to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --publish `
            --releaseName "CGPDI StudyLab v${{ steps.get_version.outputs.VERSION }}" `
            --tag "v${{ steps.get_version.outputs.VERSION }}"

      - name: Set Release Notes Body
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.get_version.outputs.VERSION }}" --notes-file release-notes.md

      - name: Upload Extra Assets (Portable ZIP + Machine-Wide MSI)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.get_version.outputs.VERSION }}" `
            "CGPDI-StudyLab-Portable-win-x64.zip" `
            "CGPDI-StudyLab-MachineWide.msi" `
            --clobber