name: Build & Release Executable and Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Portable ZIP & Installer Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
            $tag = "v$ver"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } else {
            # Lê major e minor do csproj (ex: 1.0) e combina com o número da execução para auto-incrementar a cada commit
            [xml]$xml = Get-Content "CGPDI.StudyLab/CGPDI.StudyLab.csproj"
            $baseVer = $xml.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($baseVer)) { $baseVer = "1.0.0" }
            
            $parts = $baseVer.Split('.')
            $major = if ($parts.Length -gt 0) { $parts[0] } else { "1" }
            $minor = if ($parts.Length -gt 1) { $parts[1] } else { "0" }
            $runNum = "${{ github.run_number }}"
            
            $ver = "$major.$minor.$runNum"
            $tag = "v$ver"
          }
          Write-Host "Auto-Incremented Release Tag: $tag, Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Application & Verify
        run: |
          dotnet build CGPDI.StudyLab/CGPDI.StudyLab.csproj -c Release `
            /p:Version=${{ steps.get_version.outputs.VERSION }} `
            /p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}.0 `
            /p:FileVersion=${{ steps.get_version.outputs.VERSION }}.0

      - name: Run Unit & UI Tests (gate)
        shell: pwsh
        run: |
          dotnet test CGPDI.StudyLab.Tests/CGPDI.StudyLab.Tests.csproj -c Release `
            --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Testes falharam. A release não pode ser publicada com regressões."
          }

      - name: Publish Single-File Self-Contained App (win-x64)
        shell: pwsh
        run: |
          dotnet publish CGPDI.StudyLab/CGPDI.StudyLab.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64 `
            /p:Version=${{ steps.get_version.outputs.VERSION }} `
            /p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}.0 `
            /p:FileVersion=${{ steps.get_version.outputs.VERSION }}.0
          
          # Remove arquivos de debug (.pdb) da pasta de distribuição
          Get-ChildItem -Path "publish/win-x64" -Filter "*.pdb" | Remove-Item -Force

      - name: Create Portable Single Executable and Clean ZIP
        shell: pwsh
        run: |
          # 1. Copia o executável único direto para download
          Copy-Item "publish/win-x64/CGPDI.StudyLab.exe" "CGPDI-StudyLab-Portable.exe" -Force

          # 2. Cria arquivo de instruções amigável
          "CGPDI StudyLab v${{ steps.get_version.outputs.VERSION }} - Executavel Unico Portatil`r`n`r`nBasta dar dois cliques em CGPDI.StudyLab.exe para iniciar!`r`nNao requer instalacao nem direitos de administrador." | Out-File -FilePath "publish/win-x64/COMO-USAR.txt" -Encoding utf8

          # 3. Compacta o ZIP portátil limpo (apenas o .exe e o .txt)
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "CGPDI-StudyLab-Portable-win-x64.zip" -CompressionLevel Optimal
          Write-Host "Portable Single-File and ZIP created successfully."

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Windows Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.get_version.outputs.VERSION }} installer/setup_script.iss
          if (Test-Path "dist-installer/CGPDI-StudyLab-Setup.exe") {
            Move-Item -Path "dist-installer/CGPDI-StudyLab-Setup.exe" -Destination "CGPDI-StudyLab-Setup.exe" -Force
            Write-Host "Installer created successfully: CGPDI-StudyLab-Setup.exe"
          } else {
            throw "Installer binary was not generated."
          }

      - name: Upload Binaries to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CGPDI-StudyLab-v${{ steps.get_version.outputs.VERSION }}-Binaries
          path: |
            CGPDI-StudyLab-Setup.exe
            CGPDI-StudyLab-Portable.exe
            CGPDI-StudyLab-Portable-win-x64.zip
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "CGPDI StudyLab ${{ steps.get_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            CGPDI-StudyLab-Setup.exe
            CGPDI-StudyLab-Portable.exe
            CGPDI-StudyLab-Portable-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
