name: Capture App Screenshots & GIF

# Dispara automaticamente após o release-app terminar com sucesso.
# Também pode ser acionado manualmente via workflow_dispatch.
on:
  workflow_run:
    workflows:
      - "Build & Release Executable and Installer"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Screenshots & Generate GIF
    runs-on: windows-latest

    # Só executa se o workflow pai terminou com sucesso,
    # ou se foi disparado manualmente (workflow_dispatch).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Log do workflow que disparou esta execução
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            Write-Host "Disparado por: ${{ github.event.workflow_run.name }}"
            Write-Host "Conclusão   : ${{ github.event.workflow_run.conclusion }}"
            Write-Host "Branch      : ${{ github.event.workflow_run.head_branch }}"
            Write-Host "Commit      : ${{ github.event.workflow_run.head_sha }}"
          } else {
            Write-Host "Disparado manualmente (workflow_dispatch)"
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Faz checkout do commit exato que gerou a release
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          ffmpeg -version | Select-Object -First 1

      - name: Capture Screenshots and GIF
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          powershell -ExecutionPolicy Bypass -File scripts/capture-screenshots.ps1 `
            -StartupWaitSec 15 `
            -TabWaitMs 3000

      - name: Verify output files
        shell: pwsh
        run: |
          $screenshots = Get-ChildItem docs/public/screenshots/*.png -ErrorAction SilentlyContinue
          $gif = Get-Item docs/public/gifs/demo.gif -ErrorAction SilentlyContinue
          Write-Host "Screenshots capturados: $($screenshots.Count)"
          $screenshots | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB,1)) KB)" }
          if ($gif) {
            Write-Host "GIF: $($gif.Name) ($([math]::Round($gif.Length/1MB,2)) MB)"
          } else {
            Write-Warning "GIF nao encontrado - verifique o log do FFmpeg."
          }
          if ($screenshots.Count -eq 0) {
            throw "Nenhum screenshot capturado. O pipeline falhou."
          }

      - name: Commit updated screenshots and GIF
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/public/screenshots/ docs/public/gifs/

          $changed = git status --porcelain
          if ($changed) {
            git commit -m "chore(docs): atualizar screenshots e GIF automaticamente [skip ci]"
            git push
            Write-Host "Screenshots commitados com sucesso."
          } else {
            Write-Host "Nenhuma mudanca nos screenshots — commit pulado."
          }

